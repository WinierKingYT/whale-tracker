[project]
name = "whale-tracker"
version = "0.1.0"
description = "AI-assisted whale tracking and market-reading observer (Gözlemci phase)"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whale_tracker"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
